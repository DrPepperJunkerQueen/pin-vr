<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Inspektor Tomografii 3D - Pomiary Pinu i Porów</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    :root {
      --bg-glass: rgba(13, 17, 23, 0.88);
      --border-glass: rgba(56, 189, 248, 0.25);
      --accent-cyan: #38bdf8;
      --accent-amber: #f59e0b;
      --text-main: #f1f5f9;
      --text-dim: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #030712; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text-main); }

    /* Top HUD */
    #topHeader {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      z-index: 999;
      pointer-events: none;
    }

    .badge-card {
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      border-radius: 12px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; transform: scale(1.15); } }

    .btn-action {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(14, 165, 233, 0.35));
      border: 1px solid var(--accent-cyan);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.25);
    }
    .btn-action:hover {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.35), rgba(14, 165, 233, 0.5));
      box-shadow: 0 4px 20px rgba(56, 189, 248, 0.45);
      transform: translateY(-1px);
    }
    .btn-action:active { transform: translateY(1px); }

    /* Bottom Control Bar */
    #bottomDock {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: min(94vw, 760px);
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 18px;
      padding: 16px 20px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.65);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }

    .toggle-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 12px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .toggle-card:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(56, 189, 248, 0.4);
    }
    .toggle-card.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent-cyan);
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 13px;
    }
    .slider-label {
      width: 155px;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
    }
    .slider-input {
      flex: 1;
      accent-color: var(--accent-cyan);
      height: 5px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
      cursor: pointer;
    }

    #notificationOverlay {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--accent-cyan);
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 13px;
      z-index: 1000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    @media (max-width: 600px) {
      #bottomDock { bottom: 12px; padding: 12px; gap: 8px; }
      .slider-label { width: 130px; font-size: 11px; }
      .controls-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div id="topHeader">
    <div class="badge-card">
      <div class="status-dot" id="statusDot"></div>
      <div>
        <div style="font-weight: 700; font-size: 13px; letter-spacing: 0.5px;">TOMOGRAFIA PINU VR</div>
        <div style="font-size: 11px; color: var(--text-dim);" id="fpsMetric">FPS: -- | Promień: 5m</div>
      </div>
    </div>

    <!-- Suwak ostrości / Pixel Ratio (0.01x - 2.00x) -->
    <div class="badge-card" style="gap: 12px;">
      <span style="font-size: 12px; color: var(--text-dim);">Ostrość:</span>
      <input type="range" id="sliderResolution" class="slider-input" min="0.01" max="2.00" step="0.01" value="1.00" style="width: 100px;">
      <span id="sliderResBadge" style="font-size: 12px; font-weight: 600; color: var(--accent-cyan); min-width: 44px; text-align: right;">1.00x</span>
    </div>

    <div>
      <input type="file" id="filePicker" accept=".glb,.gltf" style="display: none;">
      <button class="btn-action" onclick="document.getElementById('filePicker').click()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        Wczytaj pin_model.glb
      </button>
    </div>
  </div>

  <div id="notificationOverlay">Powiadomienie</div>

  <!-- Bottom Interactive Dock -->
  <div id="bottomDock">
    <div class="controls-grid">
      <div class="toggle-card active" id="btnToggleTrans">
        <span style="font-size: 12px; font-weight: 600;">Rentgen Korpusu</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-cyan)" stroke-width="2">
          <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </div>

      <div class="toggle-card active" id="btnToggleOrbitView">
        <span style="font-size: 12px; font-weight: 600;">Pozycja: Środek</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-cyan)" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </div>

      <div class="toggle-card active" id="btnToggleAnim">
        <span style="font-size: 12px; font-weight: 600;">Ruch po okręgu</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-cyan)" stroke-width="2">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
      </div>

      <div class="toggle-card" id="btnToggleWire">
        <span style="font-size: 12px; font-weight: 600;">Siatka Mesh</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-cyan)" stroke-width="2">
          <rect width="18" height="18" x="3" y="3" rx="2"></rect>
          <path d="M3 9h18M3 15h18M9 3v18M15 3v18"></path>
        </svg>
      </div>
    </div>

    <!-- Sliders -->
    <div class="slider-row">
      <div class="slider-label">
        <span>Szybkość obrotu:</span>
        <span id="labelSpeed">1.0x</span>
      </div>
      <input type="range" id="sliderSpeed" class="slider-input" min="0.2" max="5.0" step="0.2" value="1.0">
    </div>

    <div class="slider-row">
      <div class="slider-label">
        <span>Przezroczystość:</span>
        <span id="labelAlpha">0.25</span>
      </div>
      <input type="range" id="sliderAlpha" class="slider-input" min="0.02" max="1.0" step="0.02" value="0.25">
    </div>

    <div class="slider-row">
      <div class="slider-label">
        <span>Próbkowanie porów:</span>
        <span id="labelDensity">100%</span>
      </div>
      <input type="range" id="sliderDensity" class="slider-input" min="5" max="100" step="5" value="100">
    </div>
  </div>

  <!-- A-Frame 3D World -->
  <a-scene embedded vr-mode-ui="enabled: true" renderer="antialias: true; colorManagement: true; precision: mediump;">
    <a-entity light="type: ambient; color: #94a3b8; intensity: 1.0;"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 1.5; position: 3 6 4;"></a-entity>
    <a-entity light="type: point; color: #38bdf8; intensity: 1.8; distance: 12; position: -2 2 -1;"></a-entity>

    <!-- Powiększony niebieski ring na podłodze: promień 5 metrów -->
    <a-ring id="orbitGuideRing" radius-inner="4.96" radius-outer="5.04" rotation="-90 0 0" position="0 0.02 0" color="#38bdf8" opacity="0.45" visible="true"></a-ring>

    <!-- Kamera w centrum na wysokości oczu 1.6m -->
    <a-entity id="cameraRig" position="0 1.6 0">
      <a-camera id="mainCamera" look-controls="pointerLockEnabled: false" wasd-controls="acceleration: 20"></a-camera>
    </a-entity>

    <!-- Kontener przemieszczający się po orbicie R=5.0m, wysokość podniesiona do Y=3.1m -->
    <a-entity id="modelContainer" position="0 3.1 -5.0">
      <a-entity id="modelScaler" scale="0.05 0.05 0.05" position="0 0 0">
        <a-entity id="loadedModel" gltf-model="pin_model.glb"></a-entity>
      </a-entity>

      <!-- Awaryjny model proceduralny -->
      <a-entity id="fallbackDemoPin" visible="false">
        <a-cylinder id="demoPinBody" height="2.0" radius="0.32" position="0 0 0" material="color: #64748b; transparent: true; opacity: 0.25;"></a-cylinder>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    const state = {
      isOrbitView: true,
      isAnimating: true,
      isXray: true,
      isWireframe: false,
      alpha: 0.25,
      density: 100,
      orbitRadius: 7.5,          // Zwiększono promień okręgu z 2.2m na 5.0m
      orbitAngle: 0,
      baseSpeed: 0.012,          // Płynna, wyważona prędkość obrotu
      speedMultiplier: 1.0,
      modelNodes: { body: [], pores: [] }
    };

    const sceneEl = document.querySelector('a-scene');
    const cameraRig = document.getElementById('cameraRig');
    const modelContainer = document.getElementById('modelContainer');
    const loadedModel = document.getElementById('loadedModel');
    const fallbackDemoPin = document.getElementById('fallbackDemoPin');
    const orbitGuideRing = document.getElementById('orbitGuideRing');

    function notify(text) {
      const banner = document.getElementById('notificationOverlay');
      if (!banner) return;
      banner.innerText = text;
      banner.style.opacity = '1';
      clearTimeout(banner._timer);
      banner._timer = setTimeout(() => { banner.style.opacity = '0'; }, 2200);
    }

    function updateOrbitView() {
      const btn = document.getElementById('btnToggleOrbitView');
      if (state.isOrbitView) {
        if (btn) btn.classList.add('active');
        cameraRig.setAttribute('position', '0 1.6 0');
        if (orbitGuideRing) orbitGuideRing.setAttribute('visible', 'true');
        notify("Tryb: Środek okręgu (Okrąg R=5m)");
      } else {
        if (btn) btn.classList.remove('active');
        cameraRig.setAttribute('position', '0 2.0 6.0');
        if (orbitGuideRing) orbitGuideRing.setAttribute('visible', 'false');
        modelContainer.setAttribute('position', '0 3.1 0');
        modelContainer.setAttribute('rotation', '0 0 0');
        notify("Tryb: Widok z zewnątrz");
      }
    }

    // Pętla animacji ruchu postępowego po powiększonym okręgu
    function onAnimationTick() {
      requestAnimationFrame(onAnimationTick);
      if (!state.isAnimating) return;

      if (state.isOrbitView) {
        state.orbitAngle += state.baseSpeed * state.speedMultiplier;

        const x = Math.sin(state.orbitAngle) * state.orbitRadius;
        const z = Math.cos(state.orbitAngle) * state.orbitRadius;

        // Podniesienie pinu na Y = 3.1m
        modelContainer.setAttribute('position', `${x} 3.1 ${z}`);

        // Stała orientacja w przestrzeni świata (brak obrotu własnego pinu)
        modelContainer.setAttribute('rotation', '0 0 0');
      } else {
        const currentRot = modelContainer.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
        modelContainer.setAttribute('rotation', `0 ${currentRot.y + 0.3 * state.speedMultiplier} 0`);
      }
    }
    requestAnimationFrame(onAnimationTick);

    // Rejestracja i mapowanie geometrii GLB
    function registerModelMeshes(root3D) {
      state.modelNodes.body = [];
      state.modelNodes.pores = [];

      root3D.traverse((child) => {
        if (child.isMesh) {
          const name = (child.name || '').toLowerCase();
          const matName = (child.material && child.material.name ? child.material.name : '').toLowerCase();

          if (name.includes('por') || matName.includes('por') || matName.includes('glow')) {
            state.modelNodes.pores.push(child);
            if (child.material) {
              child.material.emissive = new THREE.Color(1.0, 0.1, 0.05);
              child.material.emissiveIntensity = 2.5;
            }
          } else {
            state.modelNodes.body.push(child);
            if (child.material) {
              child.material.transparent = true;
              child.material.opacity = state.alpha;
              child.material.depthWrite = false;
            }
          }
        }
      });

      if (fallbackDemoPin) fallbackDemoPin.setAttribute('visible', 'false');

      applyAlpha();
      applyDensity();
      applyWireframe();
    }

    loadedModel.addEventListener('model-loaded', () => {
      const mesh = loadedModel.getObject3D('mesh');
      if (mesh) {
        registerModelMeshes(mesh);
        notify("Wczytano model tomografii GLB!");
      }
    });

    function applyAlpha() {
      state.modelNodes.body.forEach(mesh => {
        if (mesh.material) {
          mesh.material.opacity = state.alpha;
          mesh.material.transparent = state.alpha < 0.99;
          mesh.material.needsUpdate = true;
        }
      });
    }

    function applyDensity() {
      const ratio = state.density / 100.0;
      state.modelNodes.pores.forEach(mesh => {
        if (mesh.geometry) {
          const count = mesh.geometry.index 
            ? mesh.geometry.index.count 
            : (mesh.geometry.attributes.position ? mesh.geometry.attributes.position.count : 0);
          if (count > 0) {
            const drawCount = Math.max(12, Math.floor(count * ratio));
            mesh.geometry.setDrawRange(0, drawCount);
          }
        }
      });
    }

    function applyWireframe() {
      const setWire = (list) => {
        list.forEach(m => {
          if (m.material) {
            m.material.wireframe = state.isWireframe;
            m.material.needsUpdate = true;
          }
        });
      };
      setWire(state.modelNodes.body);
      setWire(state.modelNodes.pores);
    }

    function applyResolution(scale) {
      if (!sceneEl || !sceneEl.renderer) return;
      const dpr = Math.max(0.01, Math.min(2.0, (window.devicePixelRatio || 1) * scale));
      sceneEl.renderer.setPixelRatio(dpr);
      const badge = document.getElementById('sliderResBadge');
      if (badge) badge.innerText = scale.toFixed(2) + 'x';
    }

    const sliderRes = document.getElementById('sliderResolution');
    if (sliderRes) {
      sliderRes.addEventListener('input', (e) => {
        applyResolution(parseFloat(e.target.value));
      });
    }

    // Suwak prędkości
    document.getElementById('sliderSpeed').addEventListener('input', (e) => {
      state.speedMultiplier = parseFloat(e.target.value);
      document.getElementById('labelSpeed').innerText = state.speedMultiplier.toFixed(1) + 'x';
    });

    document.getElementById('btnToggleTrans').addEventListener('click', function() {
      state.isXray = !state.isXray;
      this.classList.toggle('active', state.isXray);
      state.alpha = state.isXray ? 0.25 : 1.0;
      document.getElementById('sliderAlpha').value = state.alpha;
      document.getElementById('labelAlpha').innerText = state.alpha.toFixed(2);
      applyAlpha();
    });

    document.getElementById('btnToggleOrbitView').addEventListener('click', function() {
      state.isOrbitView = !state.isOrbitView;
      updateOrbitView();
    });

    document.getElementById('btnToggleAnim').addEventListener('click', function() {
      state.isAnimating = !state.isAnimating;
      this.classList.toggle('active', state.isAnimating);
      notify(state.isAnimating ? "Wznowiono ruch" : "Zatrzymano ruch");
    });

    document.getElementById('btnToggleWire').addEventListener('click', function() {
      state.isWireframe = !state.isWireframe;
      this.classList.toggle('active', state.isWireframe);
      applyWireframe();
    });

    document.getElementById('sliderAlpha').addEventListener('input', (e) => {
      state.alpha = parseFloat(e.target.value);
      document.getElementById('labelAlpha').innerText = state.alpha.toFixed(2);
      applyAlpha();
    });

    document.getElementById('sliderDensity').addEventListener('input', (e) => {
      state.density = parseInt(e.target.value);
      document.getElementById('labelDensity').innerText = state.density + '%';
      applyDensity();
    });

    document.getElementById('filePicker').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      loadedModel.setAttribute('gltf-model', url);
      notify("Wczytywanie: " + file.name);
    });

    // Licznik FPS
    let frames = 0, lastTime = performance.now();
    function trackFPS() {
      frames++;
      const now = performance.now();
      if (now - lastTime >= 1000) {
        const fps = Math.round((frames * 1000) / (now - lastTime));
        const metric = document.getElementById('fpsMetric');
        if (metric) metric.innerText = `FPS: ${fps} | Promień: 5m`;
        frames = 0;
        lastTime = now;
      }
      requestAnimationFrame(trackFPS);
    }
    trackFPS();

    sceneEl.addEventListener('renderstart', () => {
      updateOrbitView();
      applyResolution(1.0);
    });
  </script>
</body>
</html>
